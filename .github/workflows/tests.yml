name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Initialize local test configuration
        run: dart run scripts/init_local.dart

      - name: Verify workspace and reminder recovery
        run: bash scripts/verify.sh
