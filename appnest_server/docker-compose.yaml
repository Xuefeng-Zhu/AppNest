services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: appnest
      POSTGRES_PASSWORD: "8SXTnklOoraUytTfaHhTFDiaA0UMr-GD"
    volumes:
      - appnest_data:/var/lib/postgresql/data


  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: appnest_test
      POSTGRES_PASSWORD: "a9mTIg4c_rvxnA0MbZ2iTsIU0hq0h1RV"
    volumes:
      - appnest_test_data:/var/lib/postgresql/data


volumes:
  appnest_data:
  appnest_test_data:
